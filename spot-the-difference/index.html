<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Difference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{
  --bg:#fff4d6; --ink:#3b2a63; --card:#ffffff; --accent:#ff6b4a; --good:#2dbd6e; --dot:#e6dcc3; --shadow:#e8d9a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#241b3d; --ink:#fff1c9; --card:#3a2d5c; --accent:#ff8a6b; --good:#4fe08f; --dot:#4d3f77; --shadow:#17102b;}
}
:root[data-theme="dark"]{--bg:#241b3d; --ink:#fff1c9; --card:#3a2d5c; --accent:#ff8a6b; --good:#4fe08f; --dot:#4d3f77; --shadow:#17102b;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{position:relative;background:var(--bg);color:var(--ink);font-family:"Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center;padding:16px 14px 28px}
.ver{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:12px;font-size:13px;font-weight:700;opacity:.65;letter-spacing:.3px}
h1{font-size:clamp(26px,5vw,40px);margin:4px 0 2px;font-weight:700}
.sub{margin:0 0 14px;font-size:clamp(16px,2.6vw,20px);opacity:.85}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tag{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700;font-size:clamp(15px,2.8vw,18px)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:980px;margin:0 auto}
.pic{background:var(--card);border-radius:22px;padding:8px;box-shadow:0 6px 0 var(--shadow)}
.pic svg{display:block;width:100%;height:auto;border-radius:16px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:700px){.pics{grid-template-columns:1fr;gap:12px}}
.status{margin:18px 0 8px;font-size:clamp(24px,5vw,34px);font-weight:700;min-height:1.3em}
.status.miss{color:var(--accent)}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--dot);display:grid;place-items:center;font-size:18px;transition:transform .2s,background .2s}
.dot.on{background:var(--good);transform:scale(1.15)}
button{font:inherit;font-weight:700;font-size:20px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink);box-shadow:none;padding:9px 24px}
.ring{fill:none;stroke:var(--good);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out}
.x{font:700 28px "Fredoka",sans-serif;fill:#ff3b30;text-anchor:middle;animation:fade .8s ease-out forwards}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}
.win{position:fixed;inset:0;background:rgba(36,27,61,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.win.show{display:flex}
.box{background:var(--card);border-radius:28px;padding:28px 24px;max-width:380px;animation:pop .45s ease-out}
.box .big{font-size:64px;line-height:1}
.box h2{margin:8px 0 6px;font-size:32px}
.box p{margin:0 0 18px;font-size:19px}
@media (prefers-reduced-motion:reduce){.ring,.x,.box{animation:none}.x{opacity:0}}
</style>
</head>
<body>
<!-- Version: add 0.01 here for every release pushed to GitHub (v0.01 = first push with a version number) -->
<div class="ver" id="ver" title="Version">v0.01</div>
<h1>Spot the Difference!</h1>
<p class="sub">Tap the spots where the two pictures don’t match.</p>
<div class="tags" id="tags"></div>

<div class="pics">
  <div class="pic"><svg id="A" viewBox="0 0 400 300" role="img" aria-label="Picture one"></svg></div>
  <div class="pic"><svg id="B" viewBox="0 0 400 300" role="img" aria-label="Picture two"></svg></div>
</div>

<div class="status" id="status" aria-live="polite"></div>
<div class="dots" id="dots"></div>
<div class="btns"><button id="newp">New picture</button><button id="again" class="ghost">Start over</button></div>

<div class="win" id="win">
  <div class="box">
    <div class="big">🎉⭐🎉</div>
    <h2>Congratulations!</h2>
    <p id="wintext"></p>
    <button id="play">New picture</button>
  </div>
</div>

};

// ---------- difficulty ----------
// hue: how far a colour moves, lum: how far grey/white things shift, z: [bigger, smaller],
// gaps: how far apart differences must be (relaxed step by step), mx: most differences of one kind of object
const LV={
 easy:{n:'Easy',s:'⭐',hue:[75,130],lum:.4,z:[1.42,.7],gaps:[80,55,35,0],mx:2,w:25},
 medium:{n:'Medium',s:'⭐⭐',hue:[30,45],lum:.28,z:[1.28,.78],gaps:[60,40,25,0],mx:3,w:40},
 hard:{n:'Hard',s:'⭐⭐⭐',hue:[19,28],lum:.2,z:[1.2,.83],gaps:[40,26,15,0],mx:4,w:35}
};
const WANT=10;

const hsl2rgb=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)].map(v=>v*255)};
function tweak(hex,R,L,boost){ // a nearby colour that still looks clearly different
  const n=parseInt(hex.slice(1),16),rgb=[n>>16,n>>8&255,n&255],r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  const grey=s<.2,tint=Math.round(R()*360),sign=R()<.5?-1:1;
  const deg=(L.hue[0]+R()*(L.hue[1]-L.hue[0]))*boost;
  let nh=grey?tint:(h+sign*deg+360)%360,ns=grey?.38:Math.max(s,.35),nl=grey?Math.min(.94,Math.max(.1,l+(l>.5?-1:1)*L.lum*boost)):Math.min(.78,Math.max(.25,l));
  for(let t=0;t<3;t++){ // make sure the change shows up
    const c=hsl2rgb(nh,ns,nl);
    if(Math.max(...c.map((v,i)=>Math.abs(v-rgb[i])))>=(t?60:48))break;
    nl=Math.min(.9,Math.max(.1,nl+(nl>.5?-.14:.14)));ns=Math.max(ns,.55);
  }
  return `hsl(${Math.round(nh)} ${Math.round(ns*100)}% ${Math.round(nl*100)}%)`;
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// people keep their distance from each other (for their speech bubbles) but sit closer to other things
const need=(t,f,p)=>{const a=!!T[t].person,b=!!(p.t&&T[p.t].person);return a&&b?92:((a?24:f)+(b?24:p.f))*.74};
function gen(seed,id,lv){
  const S=SC[id],L=LV[lv],R=rng(seed),pick=a=>a[Math.floor(R()*a.length)],rand=(a,b)=>a+R()*(b-a);
  const bgd=S.setup(R,rand,pick),objs=[],obst=[...(bgd.obst||[])];
  const add=(t,n)=>{
    const d=T[t],yr=(S.ys&&S.ys[t])||d.y,pl=(S.pal&&S.pal[t])||PAL[t];
    if(typeof n==='function')n=n(R);
    for(let i=0;i<n;i++)for(let k=0;k<150;k++){
      const x=rand(...(d.x||[30,370])),y=rand(yr[0],yr[1]);
      if([...objs,...obst].every(p=>Math.hypot(x-p.x,y-p.y)>=need(t,d.f,p))){
        const tiny=d.f<=14&&lv==='hard',boost=tiny?1.5:1,zz=tiny?[1.3,.78]:L.z;
        const c=pl?pick(pl):null,c2=c?tweak(c,R,L,boost):c;
        const say=d.person?pick(S.say):'';let q=say;if(d.person)while(q===say)q=pick(S.say);
        objs.push({t,x,y,c,c2,say,q,f:d.f,r:d.r,s:d.person?rand(.8,1.25):rand(.92,1.08),z:R()<.5?zz[0]:zz[1],w:pick(WALLS),sk:pick(SKIN),hr:pick(HAIR),p:pick(PANTS),fl:R()<.5?-1:1,v:R(),pv:S.pv});break;
      }
    }
  };
  [...S.lay].sort((a,b)=>T[b[0]].f-T[a[0]].f).forEach(([t,n])=>add(t,n)); // biggest things first
  const talkers=objs.filter(o=>T[o.t].person);
  talkers.forEach(p=>{p.mute=R()<.45});
  if(talkers.length>1){if(talkers.every(p=>p.mute))talkers[0].mute=false;if(talkers.every(p=>!p.mute))talkers[0].mute=true}
  const hidden=o=>talkers.filter(p=>!p.mute).some(p=>{const w=wordDiff(p);return Math.abs(o.x-w.x)<w.w+o.r&&Math.abs(o.y-w.y)<w.h+o.r});
  const bias=lv==='hard'?1:lv==='easy'?-1:0; // hard picks small things first, easy picks big things first
  const order=objs.map(o=>[R()+bias*o.f/60,o]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]),chosen=[],cnt={};
  const kinds=o=>{const all=T[o.t].k.filter(x=>!(x==='words'&&o.mute));const k=lv==='hard'&&o.f>=30?all.filter(x=>x!=='missing'):all;return k.length?k:all};
  const take=(gap,max,ignoreHidden)=>order.forEach(o=>{
    if(chosen.length<WANT&&!o.d&&(cnt[o.t]||0)<max&&chosen.every(q=>Math.hypot(o.x-q.x,o.y-q.y)>gap)&&(ignoreHidden||T[o.t].person||!hidden(o))){
      o.d=pick(kinds(o));chosen.push(o);cnt[o.t]=(cnt[o.t]||0)+1;
    }
  });
  L.gaps.forEach((gap,i)=>take(gap,i>=3?99:L.mx+i,false));
  take(0,99,true);
  return{id,lv,S,bgd,objs,ch:chosen,diffs:chosen.map(o=>o.d==='words'?wordDiff(o):{x:o.x,y:o.y,r:o.r})};
}

// ---------- drawing a picture ----------
function drawObj(o,alt){
  if(alt&&o.d==='missing')return '';
  const c=alt&&o.d==='color'?o.c2:o.c,k=o.s*(alt&&o.d==='size'?o.z:1);
  return `<g transform="translate(${fx(o.x)} ${fx(o.y)}) scale(${k.toFixed(3)})">${DRAW[o.t](c,o)}</g>`;
}
function scene(alt){
  const w=world;
  let s=w.S.bg(w.bgd);
  const key=o=>T[o.t].back?o.y-500:o.y; // tall buildings are drawn behind the sky things
  [...w.objs].sort((a,b)=>key(a)-key(b)).forEach(o=>{s+=drawObj(o,alt)});
  w.objs.forEach(o=>{ // speech bubbles sit on top of everything
    if(!T[o.t].person||o.mute||(alt&&o.d==='missing'))return;
    const k=o.s*(alt&&o.d==='size'?o.z:1);
    s+=`<g transform="translate(${fx(o.x)} ${fx(o.y)}) scale(${k.toFixed(3)})">${bubble(alt&&o.d==='words'?o.q:o.say)}</g>`;
  });
  return s;
}

// ---------- the game ----------
const svgs=[document.getElementById('A'),document.getElementById('B')];
const statusEl=document.getElementById('status');
const dotsEl=document.getElementById('dots');
const tagsEl=document.getElementById('tags');
const win=document.getElementById('win');
let world,DIFFS,TOTAL,found=new Set(),missTimer=null,lastScene='';

function label(){
  const n=found.size;
  return n===0?`Find ${TOTAL} differences!`:n===1?'1 difference found':`${n} differences found`;
}
function chooseLevel(){
  let r=Math.random()*100;
  for(const k of Object.keys(LV)){r-=LV[k].w;if(r<0)return k}
  return 'medium';
}
function newPicture(id,lv,seed){
  const ids=Object.keys(SC).filter(i=>i!==lastScene);
  id=id||ids[Math.floor(Math.random()*ids.length)];lv=lv||chooseLevel();
  lastScene=id;
  world=gen(seed!=null?seed:((Date.now()^Math.floor(Math.random()*1e9))>>>0),id,lv);
  DIFFS=world.diffs;TOTAL=DIFFS.length;render();
}
function render(){
  svgs.forEach((s,i)=>{s.innerHTML=scene(i===1)+'<g class="marks"></g>';});
  dotsEl.innerHTML=DIFFS.map(()=>'<div class="dot"></div>').join('');
  tagsEl.innerHTML=`<span class="tag">${world.S.emoji} ${world.S.name}</span><span class="tag">${LV[world.lv].s} ${LV[world.lv].n}</span>`;
  document.getElementById('wintext').textContent=`You found all ${TOTAL} differences. Great spotting!`;
  found=new Set(); update(); win.classList.remove('show');
}
function update(){
  statusEl.className='status'; statusEl.textContent=label();
  [...dotsEl.children].forEach((d,i)=>{const on=i<found.size;d.classList.toggle('on',on);d.textContent=on?'★':'';});
}
function mark(d){
  const el=d.w?`<rect class="ring" x="${(d.x-d.w-6).toFixed(1)}" y="${(d.y-d.h-6).toFixed(1)}" width="${(2*d.w+12).toFixed(1)}" height="${(2*d.h+12).toFixed(1)}" rx="14"/>`:`<circle class="ring" cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${d.r+8}"/>`;
  svgs.forEach(s=>s.querySelector('.marks').insertAdjacentHTML('beforeend',el));
}
const near=(d,x,y)=>d.w?Math.abs(x-d.x)<=d.w+6&&Math.abs(y-d.y)<=d.h+6:Math.hypot(x-d.x,y-d.y)<=d.r+6;
function tap(e){
  const s=e.currentTarget,b=s.getBoundingClientRect();
  const x=(e.clientX-b.left)/b.width*400,y=(e.clientY-b.top)/b.height*300;
  const idx=DIFFS.findIndex((d,i)=>!found.has(i)&&near(d,x,y));
  if(idx>=0){
    found.add(idx);mark(DIFFS[idx]);update();
    if(found.size===TOTAL)setTimeout(()=>win.classList.add('show'),700);
  }else if(!DIFFS.some((d,i)=>found.has(i)&&near(d,x,y))){
    const g=s.querySelector('.marks');
    g.insertAdjacentHTML('beforeend',`<text class="x" x="${x.toFixed(0)}" y="${y.toFixed(0)}">✕</text>`);
    const t=g.lastElementChild;setTimeout(()=>t.remove(),850);
    statusEl.className='status miss';statusEl.textContent='Not quite. Keep looking!';
    clearTimeout(missTimer);missTimer=setTimeout(update,1200);
  }
}
svgs.forEach(s=>s.addEventListener('click',tap));
document.getElementById('newp').onclick=()=>newPicture();
document.getElementById('again').onclick=render;
document.getElementById('play').onclick=()=>newPicture();
newPicture();
</script>
</body>
