<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoom Zoo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--bg:#e6f5ef;--panel:#fff;--ink:#12343b;--mute:#4f7077;--gold:#ffc233;--goldink:#3b2a00;--ok:#1f8a4c;--okbg:#c9f0d8;--bad:#c2312d;--badbg:#fbd5d2;--line:#b9dccf;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2227;--panel:#173239;--ink:#e9f6f2;--mute:#9bbcc2;--ok:#6fe0a0;--okbg:#1d4a35;--bad:#ff8a84;--badbg:#4d2326;--line:#2b4f57}}
:root[data-theme="dark"]{--bg:#0e2227;--panel:#173239;--ink:#e9f6f2;--mute:#9bbcc2;--ok:#6fe0a0;--okbg:#1d4a35;--bad:#ff8a84;--badbg:#4d2326;--line:#2b4f57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:100vh;position:relative}
main{max-width:420px;margin:0 auto;padding:22px 18px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.top h1{font-size:1.35rem;margin:0;font-weight:700}
.top div{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:.95rem}
.lens{position:relative;width:min(100%,320px);aspect-ratio:1;margin:2px auto 0;border-radius:50%;overflow:hidden;background:#222;border:8px solid var(--ink);box-shadow:0 0 0 4px var(--gold)}
.lens svg{display:block;width:100%;height:100%}
.lens::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 28% 20%,rgba(255,255,255,.38),transparent 38%),radial-gradient(circle,transparent 52%,rgba(0,0,0,.4))}
.info{display:flex;justify-content:space-between;align-items:center;min-height:42px}
.worth{font-weight:600}
button{font:inherit;cursor:pointer}
.zoom{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:7px 16px;font-weight:600}
.zoom:disabled{opacity:.35;cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px 8px;font-weight:600;font-size:1.05rem;min-height:56px}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);opacity:.8}
.opt:disabled{cursor:default}
.msg{text-align:center;font-weight:600;min-height:1.5em}
.fact{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.35}
.main-btn{background:var(--gold);color:var(--goldink);border:0;border-radius:16px;padding:15px;font-weight:700;font-size:1.1rem;width:100%}
.end{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:20px}
.end .big{font-size:4rem;font-weight:700;line-height:1}
.end h2{margin:0;font-size:1.5rem}
.end p{margin:0;color:var(--mute)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,24,28,.72);backdrop-filter:blur(3px)}
.ov .card{width:100%;max-width:360px;background:var(--panel);border:3px solid var(--gold);border-radius:24px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.ov .em{font-size:3.6rem;line-height:1}
.ov h2{margin:0;font-size:1.9rem}
.ov .nm{font-size:1.2rem;font-weight:600}
.ov .pt{font-weight:700;color:var(--ok);font-size:1.15rem}
.ov.lose .pt{color:var(--bad)}
.ov.lose .card{border-color:var(--bad)}
.ov p{margin:0;color:var(--mute);line-height:1.35}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold)}
.lvl{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:700;pointer-events:none;color:#fff;background:rgba(8,24,28,.55);text-shadow:0 3px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ov .card,.lvl{animation:none}}
.goes{text-align:center;font-weight:600;font-size:1.1rem;letter-spacing:2px}
.shake{animation:shake .4s;border-color:var(--bad)!important}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shop{display:flex;flex-direction:column;gap:12px}
.shopTop{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}
.shopAv svg{display:block;width:150px;margin:0 auto;border-radius:20px;border:4px solid var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600}
.tab.on{background:var(--gold);color:var(--goldink);border-color:transparent}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-size:.82rem;color:var(--ink)}
.item svg{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:4px}
.item.eq{border-color:var(--ok)}
#endAv svg{width:120px;height:130px;border-radius:50%;border:4px solid var(--gold);display:block}
.coinline{font-weight:700;color:var(--ok);font-size:1.1rem}
.ov .card{max-height:92vh;overflow-y:auto}
.wlist{display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow-y:auto}
.wp{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px;color:var(--ink);font-size:1rem}
.wp svg{width:54px;height:54px;border-radius:50%;flex:none}
.wp.on{border-color:var(--gold)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.addrow .main-btn{width:auto;padding:11px 18px}
.hsl{text-align:center;font-weight:600;font-size:.95rem}
.hst{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.hst i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.hs{margin-bottom:2px}
.shopName,.introWho{text-align:center;font-weight:700}
#introAv svg{width:96px;height:104px;border-radius:50%;border:4px solid var(--gold);margin:0 auto;display:block}
.item.lock svg{opacity:.45}
.ver{position:absolute;top:calc(3px + env(safe-area-inset-top,0px));right:10px;font-size:.7rem;font-weight:600;color:var(--mute);opacity:.85;pointer-events:none;z-index:25}
.typebox{display:flex;gap:10px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:1.15rem;font-weight:600;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink)}
.typebox .main-btn{width:auto;padding:13px 20px}
.hintbtn{align-self:center}
.hide{display:none}
.cf{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:30}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

<div class="shop hide" id="shop">

    <div class="msg" id="shopMsg"></div>

</main>
<div class="ov" id="intro"><div class="card"><div class="em">🔍🐾</div><h2>Zoom Zoo</h2><p>Guess the animal from a tiny zoomed-in piece. Zoom out when you need help, but zoom all the way out and you lose a go. Type your answer and clear all 10 levels.</p><div id="introAv"></div><div class="introWho" id="introWho"></div><p id="introCoins"></p><button class="main-btn hide" id="contBtn">▶ Continue</button><button class="main-btn" id="playBtn">Play</button><button class="zoom" id="introShop">🛍️ Avatar shop</button><button class="zoom" id="introSwitch">👥 Switch player</button></div></div>
<div class="ov hide" id="ov"><div class="card"><div class="em" id="ovEmoji"></div><h2 id="ovTitle"></h2><div class="nm" id="ovName"></div><div class="pt" id="ovPts"></div><p id="ovFact"></p><div class="bar"><i id="ovBar"></i></div><button class="main-btn" id="ovNext">Next animal</button></div></div>
<div class="ov hide" id="who"><div class="card"><h2>Who’s playing?</h2><div class="wlist" id="wlist"></div><div class="addrow"><input id="wname" maxlength="12" autocomplete="off" placeholder="New player name" aria-label="Player name"><button class="main-btn" id="wadd">Add</button></div></div></div>

  if(shopFrom==="end"){$("end").classList.remove("hide");$("endAv").innerHTML=avatar(AV.eq,"e","10 20 140 150")}
  else{$("play").classList.remove("hide");if(shopFrom==="intro"){$("intro").className="ov";updIntro()}}};
$("nameSave").onclick=function(){var n=$("nameIn").value.trim().slice(0,12);if(!n)return;AV.name=n;saveAV();renderShop();updIntro();$("shopMsg").textContent="Name changed to "+n+"."};
$("nameIn").addEventListener("keydown",function(e){if(e.key==="Enter")$("nameSave").onclick()});

/* ---- Saved progress ---- */
var unl="";
function runOf(n){return{d:deck.slice(0,ROUNDS).map(function(x){return x.k}),i:n,score:score,streak:streak}}
function updIntro(){
  $("introWho").textContent="Playing as "+AV.name+" · Best: "+AV.best+" pts · Levels cleared: "+(AV.done||0);
  $("introAv").innerHTML=avatar(AV.eq,"i","10 20 140 150");
  var r=AV.run;$("contBtn").className="main-btn"+(r?"":" hide");
  if(r)$("contBtn").textContent="▶ Continue: Level "+Math.min(r.i+1,ROUNDS)+" of "+ROUNDS+" ("+r.score+" pts)";
  $("playBtn").textContent=r?"New game":"Play"}
function resume(){
  var r=AV.run;deck=r.d.map(function(k){return{a:S[k],k:k}});i=r.i;score=r.score;streak=r.streak||0;playing=true;
  $("intro").className="ov hide";$("end").classList.add("hide");$("play").classList.remove("hide");
  if(i>=ROUNDS)end();else round()}
var oldRound5=round;round=function(){oldRound5();unl="";if(playing){AV.run=runOf(i);saveAV()}};
var oldFinish3=finish;finish=function(){oldFinish3();
  if(won>0){AV.done=(AV.done||0)+1;var n=[];Object.keys(SHOP).forEach(function(k){SHOP[k][1].forEach(function(r){if(r[4]&&r[4]===AV.done)n.push(r[1])})});unl=n.join(", ")}
  AV.run=runOf(i+1);saveAV()};
var oldSR=showResult;showResult=function(){oldSR();if(unl)$("ovFact").textContent="🎁 New avatar item unlocked: "+unl+"! Open the 🛍️ shop to wear it."};
var oldEnd2=end;end=function(){oldEnd2();AV.run=null;saveAV();updIntro()};
$("contBtn").onclick=resume;
$("playBtn").onclick=function(){$("intro").className="ov hide";playing=true;start()};
updIntro();
var fullHit=false;
var oldWorth=worth;worth=function(){oldWorth();$("zoomBtn").textContent=level===2?"Zoom out (−1 go)":"Zoom out";
  if(!answered&&level>=3&&!fullHit){fullHit=true;tries++;goes();shake();tone(150,.28,"sawtooth");buzz([40,40,40]);var left=MAXG-tries;
    if(left<=0){$("msg").textContent="Fully zoomed out and no goes left. It was a "+deck[i].a.n+".";won=0;finish()}
    else $("msg").textContent="Fully zoomed out! You lost a go. "+left+(left===1?" go":" goes")+" left."}};
var oldRound4=round;round=function(){oldRound4();fullHit=false};
$("again").onclick=start;
start();
</script>
