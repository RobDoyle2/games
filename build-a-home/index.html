<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@500;700;800&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column on a blueprint grid. Coin purse and rank on top, the house or a tab's cards in the middle, three chunky tabs at the bottom. */
  --ink:#14233a; --line:#2d4a73;
  --paper:#f2f5f9; --paper2:#dfe6f0; --text:#16243a; --muted:#566880;
  --sun:#ffc531; --sun-d:#c98f00; --brick:#d8573c; --leaf:#2e9e63; --sky:#3d8fe0;
  --display:'Titan One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--ink);background-image:linear-gradient(rgba(120,170,230,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.09) 1px,transparent 1px);background-size:28px 28px;font-family:var(--body);color:var(--text);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* header */
header{flex:none;padding:12px 16px 8px;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:25px;line-height:1;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.purse{position:relative;display:flex;align-items:center;gap:8px;background:#0c1829;border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;font-family:var(--display);font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.purse svg{width:28px;height:28px;flex:none}
.float{position:absolute;right:10px;top:-6px;font-family:var(--display);font-size:20px;color:var(--sun);animation:floatup 1.2s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.5)}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
.rankrow{margin-top:8px;display:grid;grid-template-columns:auto auto 1fr auto;gap:9px;align-items:center;font-size:12px;font-weight:700;color:#b9cbe3}
.avbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#9fd3ee;padding:0;overflow:hidden;cursor:pointer;line-height:0}
.avbtn svg{width:100%;height:100%}
.rank{color:#fff;font-family:var(--display);font-size:14px;font-weight:400}
.bar{height:8px;border-radius:99px;background:#0c1829;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}

/* body */
main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
section[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.lead{color:#cfdcee;font-size:14px;padding:2px 2px 0}
.center{text-align:center}

/* buttons */
.btn{font-family:var(--display);font-size:16px;line-height:1.1;border:0;border-radius:14px;padding:12px 16px;background:var(--sun);color:#3a2700;box-shadow:0 4px 0 var(--sun-d);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn.sm{padding:9px 14px;font-size:15px}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #24629f}
.btn.blue:active{box-shadow:0 1px 0 #24629f}
.btn.ghost{background:var(--paper2);color:var(--text);box-shadow:0 4px 0 #b4c0d1}
.btn.ghost:active{box-shadow:0 1px 0 #b4c0d1}
.btn.wide{width:100%}
.btn[aria-disabled="true"]{background:#cfd7e3;color:#667791;box-shadow:0 4px 0 #a9b5c7}
.btn small{display:block;font-family:var(--body);font-weight:800;font-size:11px;opacity:.85;margin-top:3px}

/* nav */
nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px 14px;background:linear-gradient(rgba(8,16,30,0),rgba(8,16,30,.85))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;padding:8px 4px 7px;background:#223a5c;color:#b9cbe3;font-weight:800;font-size:12px;box-shadow:0 3px 0 #0b1626;cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--sun);color:#3a2700;box-shadow:0 3px 0 var(--sun-d)}

/* house */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper2);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;font-family:var(--display);font-size:15px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.rooms{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin:0 -2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rchip{flex:none;border:0;border-radius:99px;background:var(--paper2);padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.rchip i{font-style:normal;font-weight:700;color:var(--muted);margin-left:5px}
.rchip.on{background:var(--ink);color:#fff}
.rchip.on i{color:#9fb6d6}
.scene{border-radius:14px;overflow:hidden;background:#8ed3f4;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.035)}100%{transform:scale(1)}}
.smoke circle{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 3.4s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:1.1s}
.smoke circle:nth-child(3){animation-delay:2.2s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.85}100%{opacity:0;transform:translate(16px,-36px) scale(1.8)}}
.armup{display:none}
.working .armup{display:inline}
.working .armrest-r{display:none}
.working .hammer{transform-box:fill-box;transform-origin:50% 100%;animation:swing .28s ease-in-out 3}
.working .avbob{animation:hop .28s ease-in-out 3}
@keyframes swing{0%{transform:rotate(-25deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-25deg)}}
@keyframes hop{50%{transform:translateY(-3px)}}
.titlerow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:12px 0 10px}
.titlerow h2{margin:0;flex:1 1 100%}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--paper2);color:var(--text)}
.chip.good{background:#d3f0df;color:#17623a}
.chip.bad{background:#fbdcd4;color:#8a2c18}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border-radius:12px;padding:8px 8px 9px;text-align:center}
.stat span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stat b.pos{color:var(--leaf)} .stat b.neg{color:var(--brick)}
.trend{margin-top:10px;background:#fff4cf;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;color:#5b4300}
.part{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed var(--paper2)}
.part.first{border-top:0}
.pname{font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pstate{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:24px;height:7px;border-radius:4px;background:var(--paper2)}
.pips i.on{background:var(--leaf)}
.upbtn{min-width:124px;text-align:center}
.maxed{min-width:124px;text-align:center;font-family:var(--display);color:var(--leaf);font-size:15px}
.sellbar{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:8px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
.swatches span{font-size:13px;font-weight:800;color:var(--muted);margin-right:2px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--paper2);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}

/* market */
.listing{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:stretch}
.thumb{border-radius:12px;overflow:hidden;line-height:0;align-self:start}
.thumb svg{width:100%;height:auto}
.ldet{display:flex;flex-direction:column;gap:7px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.price svg{width:20px;height:20px}
.locked{border:2px dashed #4b6a95;border-radius:16px;padding:12px;color:#b9cbe3;font-weight:700;font-size:14px;text-align:center}
.note{background:#fff4cf;color:#5b4300;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.wh{color:#fff;padding:2px 2px 0}

/* jobs */
.job{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.job p{color:var(--muted);font-size:14px;margin-top:3px}
.best{font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
.lvl{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:800;font-size:13px}
.lvl button{width:28px;height:28px;border-radius:50%;border:0;background:var(--paper2);font-weight:800;font-size:16px;line-height:1;cursor:pointer}
.lvl button[disabled]{opacity:.35;cursor:default}
.lvl b{font-family:var(--display);font-weight:400;font-size:16px;min-width:56px;text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}
.hud b{font-family:var(--display);font-weight:400;font-size:18px}
.leave{border:0;background:var(--paper2);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.track{position:relative;height:46px;border-radius:12px;background:#24385a;overflow:hidden;margin:10px 0 14px}
.zone{position:absolute;top:0;bottom:0;background:#2e9e63}
.zone i{position:absolute;left:30%;right:30%;top:0;bottom:0;background:#7be0a6}
.marker{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:#fff;border-radius:4px;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.plank{background:#c9975b;border-radius:12px;height:96px;position:relative;overflow:hidden;box-shadow:inset 0 -8px 0 rgba(0,0,0,.16)}
.plank svg{position:absolute;inset:0;width:100%;height:100%}
.verdict{height:26px;text-align:center;font-family:var(--display);font-size:20px;margin:8px 0 10px}
.pipsrow{display:flex;gap:6px;justify-content:center;margin-top:6px}
.pipsrow i{width:26px;height:10px;border-radius:5px;background:var(--paper2)}
.pipsrow i.perfect{background:var(--sun)} .pipsrow i.good{background:var(--leaf)} .pipsrow i.miss{background:var(--brick)}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:16px;background:#3b2d23;box-shadow:inset 0 -9px 0 #231810;overflow:hidden;cursor:pointer;touch-action:manipulation}
.crit{position:absolute;left:12%;right:12%;bottom:-75%;transition:bottom .1s}
.crit svg{width:100%;display:block}
.hole.up .crit{bottom:8%}
.hole.hit{background:#2e9e63}
.hole.oops{background:var(--brick)}
.timebar{height:10px;border-radius:99px;background:var(--paper2);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--sky)}
.tiles{display:grid;gap:8px}
.tile{aspect-ratio:1;border:0;padding:0;border-radius:12px;background:repeating-linear-gradient(45deg,#8c99ad 0 6px,#7f8da3 6px 12px);box-shadow:0 3px 0 #5d6b82;overflow:hidden;cursor:pointer;touch-action:manipulation}
.tile svg{width:100%;height:100%;display:block}
.tile.open{animation:flip .25s ease-out}
.tile.done{box-shadow:0 0 0 3px var(--leaf)}
@keyframes flip{from{transform:scaleX(.2)}to{transform:scaleX(1)}}
.tower{position:relative;height:288px;border-radius:12px;overflow:hidden;background:linear-gradient(#9fd3ee,#d9f0fa);margin-bottom:12px}
.tin{position:absolute;left:0;right:0;bottom:0;height:600px;transition:transform .2s}
.brk{position:absolute;height:24px;border-radius:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.3)}
.pots{display:grid;gap:12px;margin:12px 0}
.pot{aspect-ratio:1.5;border:0;border-radius:16px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.22);cursor:pointer;opacity:.62;transition:transform .08s,opacity .08s,filter .08s;touch-action:manipulation}
.pot.lit{opacity:1;transform:scale(1.07);filter:brightness(1.25) saturate(1.2);box-shadow:inset 0 -10px 0 rgba(0,0,0,.22),0 0 0 4px #fff}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:6px 0}
.result .big{font-family:var(--display);font-size:46px;line-height:1;color:var(--leaf)}
.result .big.zero{color:var(--muted)}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(8,16,30,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 16px 22px;animation:rise .25s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.offer{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:#fff;border-radius:14px;padding:12px}
.offer .who{font-weight:800}
.offer .why{font-size:13px;color:var(--muted)}
.offer .amt{font-family:var(--display);font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
.offer .pl{font-size:13px;font-weight:800;text-align:right}
.offer .pl.pos{color:var(--leaf)} .offer .pl.neg{color:var(--brick)}
.offer .btn{grid-column:1 / -1;margin-top:8px}
.sold{align-items:center;text-align:center}
.sold .big{font-family:var(--display);font-size:54px;line-height:1}
.sold .big.pos{color:var(--leaf)} .sold .big.neg{color:var(--brick)}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:22px 22px 0 0}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(480px) rotate(540deg);opacity:.9}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:calc(100% - 32px);background:#0c1829;color:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;text-align:center;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.tiny{background:none;border:0;color:#8ea6c6;font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;align-self:center}

/* sale paper */
.bubble{align-self:center;background:#fff;border-radius:16px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.15);text-align:center}
.bubble small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.paper{position:relative;background:#fffdf6;border-radius:6px;padding:14px 16px 14px;box-shadow:0 3px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.16);transform:rotate(-.5deg);overflow:hidden;min-height:250px}
.paper h3{font-size:15px;letter-spacing:.07em;text-align:center;border-bottom:2px solid var(--text);padding-bottom:7px;margin-bottom:8px}
.paper dl{margin:0}
.paper dl div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed #cbd5e3;font-size:14px}
.paper dt{color:var(--muted);font-weight:700}
.paper dd{margin:0;font-weight:800;text-align:right}
.sigrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;font-size:12px;font-weight:800;color:var(--muted)}
.sig{font-family:var(--hand);font-size:30px;line-height:1;color:#1f3f8f;border-bottom:2px solid #1f3f8f;padding:0 8px;min-width:120px;text-align:center}
.mark{position:absolute;font-family:var(--display);font-size:40px;line-height:1;color:#d8312b;border:5px solid #d8312b;border-radius:10px;padding:2px 12px;letter-spacing:.06em;opacity:.88;transform:translate(-50%,-50%) rotate(-14deg);animation:thud .35s ease-out;pointer-events:none}
@keyframes thud{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.bump{animation:bump .3s ease-out}
@keyframes bump{30%{transform:rotate(-.5deg) translateY(3px)}}
.stampzone{display:flex;align-items:center;justify-content:center;height:104px;position:relative}
#stamp{width:70px;height:90px;border:0;background:none;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:5;transition:transform .15s}
#stamp.lift{cursor:grabbing;transition:none;filter:drop-shadow(0 10px 6px rgba(0,0,0,.3))}
#stamp svg{width:100%;height:100%;display:block;pointer-events:none}
.stamphint{text-align:center;font-weight:700;color:var(--muted);font-size:13px}

/* avatar creator */
#creator{position:fixed;inset:0;z-index:25;overflow-y:auto;background-color:var(--ink);background-image:linear-gradient(rgba(120,170,230,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.09) 1px,transparent 1px);background-size:28px 28px}
#creator[hidden]{display:none}
.cwrap{max-width:520px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.cwrap h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;color:var(--sun);margin:0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.cprev{background:linear-gradient(#9fd3ee,#d9f0fa 70%,#6cbf74 70%);border-radius:18px;height:200px;display:flex;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.cprev svg{height:100%;width:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input[type=text]{font:inherit;font-weight:800;font-size:17px;padding:11px 12px;border-radius:12px;border:3px solid var(--paper2);background:#fff;color:var(--text);width:100%}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{border:0;border-radius:99px;background:var(--paper2);padding:8px 13px;font-weight:800;font-size:14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="brand">Build a Home</div>
      <div class="purse" id="purse" aria-live="polite"><span id="coinicon"></span><span id="coins">50</span></div>
    </div>
    <div class="rankrow">
      <button class="avbtn" id="avbtn" data-act="avatar" aria-label="Change your builder"></button>
      <span class="rank" id="rank">Newbie</span>
      <div class="bar"><i id="rankbar" style="width:0%"></i></div>
      <span id="rankinfo">0 flips</span>
    </div>
  </header>

  <main id="main">
    <section id="tab-house" class="stack"></section>
    <section id="tab-games" class="stack" hidden></section>
    <section id="tab-market" class="stack" hidden></section>
  </main>

  <nav role="tablist" aria-label="Game sections">
    <button class="tab" role="tab" id="t-house" data-act="go" data-tab="house" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-5h4v5"/></svg>My House</button>

  var rf=up[0],wl=up[1],wn=up[2],dr=up[3],gd=up[4],pc=up[5];
  var avg=up.reduce(function(a,b){return a+b},0)/18;
  var gY=200,cx=180,w=T.w,fh=48,H=T.floors*fh,x0=cx-w/2,top=gY-H,rh=28+w/16,bw=w/T.bays;
  var bayX=function(k){return x0+bw*(k+.5)}, dX=bayX(T.door);
  var sky=mix('#aeb7bb','#8ed3f4',Math.min(1,avg*1.25));
  var rR=rng(h.seed+1),rW=rng(h.seed+2),rG=rng(h.seed+3);
  var yb=function(dx){return top-rh*(1-Math.min(1,Math.abs(dx)/(w/2+12)))};
  var z=[.7,.8,.85,.95,1.04,1.12][h.tier],vw=360*z,vh=250*z,vx=180-vw/2,vy=250-vh;
  var s='<svg viewBox="'+vx+' '+vy+' '+vw+' '+vh+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+T.name+', '+Math.round(avg/3*100)+' percent restored outside">';
  s+='<rect x="'+vx+'" y="'+vy+'" width="'+vw+'" height="'+vh+'" fill="'+sky+'"/>';
  var sunX=vx+vw*.88,sunY=vy+vh*.17,c1=vx+vw*.17,c2=vx+vw*.68;
  if(avg>.45) s+='<circle cx="'+sunX+'" cy="'+sunY+'" r="'+(26+avg*8)*z+'" fill="#ffe27a" opacity=".28"/><circle cx="'+sunX+'" cy="'+sunY+'" r="'+(14+avg*6)*z+'" fill="#ffe27a"/>';
  s+='<g fill="'+mix('#8d979c','#ffffff',Math.min(1,avg*1.4))+'" opacity=".92"><ellipse cx="'+c1+'" cy="'+(vy+vh*.17)+'" rx="'+30*z+'" ry="'+10*z+'"/><ellipse cx="'+(c1+22*z)+'" cy="'+(vy+vh*.13)+'" rx="'+20*z+'" ry="'+9*z+'"/><ellipse cx="'+c2+'" cy="'+(vy+vh*.3)+'" rx="'+26*z+'" ry="'+8*z+'"/></g>';
  var grass=mix('#8c8a55','#5cbd68',[0,.5,.8,1][gd]);
  s+='<rect x="'+vx+'" y="'+(gY-2)+'" width="'+vw+'" height="52" fill="'+grass+'"/><rect x="'+vx+'" y="'+(gY-2)+'" width="'+vw+'" height="5" fill="#000000" opacity=".12"/>';

  var wallC=mix('#8e8878',P.wall,[0,.5,1,1][wl]);
  s+='<rect x="'+x0+'" y="'+top+'" width="'+w+'" height="'+H+'" fill="'+wallC+'"/>';
  for(var f=1;f<T.floors;f++) s+='<rect x="'+x0+'" y="'+(top+f*fh-2)+'" width="'+w+'" height="4" fill="#000000" opacity=".1"/>';
  var i,px,py;
  if(wl===0){
    for(i=0;i<3;i++){px=x0+6+rW()*(w-44);py=top+6+rW()*(H-30);s+='<rect x="'+px+'" y="'+py+'" width="'+(16+rW()*10)+'" height="'+(10+rW()*6)+'" fill="#a67a62"/>';}
    for(i=0;i<2;i++){px=x0+10+rW()*(w-30);py=top+4+rW()*(H-40);s+='<polyline points="'+px+','+py+' '+(px+5)+','+(py+9)+' '+(px-2)+','+(py+16)+' '+(px+6)+','+(py+26)+'" fill="none" stroke="#3b342c" stroke-width="2"/>';}
    for(i=0;i<3;i++){px=x0+rW()*w;s+='<ellipse cx="'+px+'" cy="'+(top+H*.3+rW()*H*.5)+'" rx="'+(10+rW()*10)+'" ry="'+(6+rW()*8)+'" fill="#3a3228" opacity=".15"/>';}
  } else if(wl===1){
    for(i=0;i<3;i++){px=x0+6+rW()*(w-44);py=top+6+rW()*(H-30);s+='<rect x="'+px+'" y="'+py+'" width="'+(16+rW()*10)+'" height="'+(10+rW()*6)+'" fill="'+mix(wallC,'#ffffff',.3)+'" stroke="#000000" stroke-opacity=".1"/>';}
  } else {
    s+='<rect x="'+x0+'" y="'+(gY-4)+'" width="'+w+'" height="4" fill="#000000" opacity=".08"/>';
    if(wl===3){
      s+='<rect x="'+x0+'" y="'+top+'" width="6" height="'+H+'" fill="'+P.trim+'"/><rect x="'+(x0+w-6)+'" y="'+top+'" width="6" height="'+H+'" fill="'+P.trim+'"/><rect x="'+(x0-3)+'" y="'+top+'" width="'+(w+6)+'" height="5" fill="'+P.trim+'"/><rect x="'+x0+'" y="'+(gY-9)+'" width="'+w+'" height="9" fill="#cfcabd"/>';
      for(i=x0+10;i<x0+w;i+=18) s+='<line x1="'+i+'" y1="'+(gY-9)+'" x2="'+i+'" y2="'+gY+'" stroke="rgba(0,0,0,.18)"/>';
    }
  }

  var chx=cx+w*.2,cyb=yb(w*.2);
  if(rf===0) s+='<polygon points="'+chx+','+(cyb+22)+' '+chx+','+(cyb-8)+' '+(chx+5)+','+(cyb-13)+' '+(chx+9)+','+(cyb-7)+' '+(chx+13)+','+(cyb-11)+' '+(chx+16)+','+(cyb-4)+' '+(chx+16)+','+(cyb+22)+'" fill="#7d4a3b"/>';
  else {
    s+='<rect x="'+chx+'" y="'+(cyb-26)+'" width="16" height="48" fill="#a4513d"/><rect x="'+(chx-2)+'" y="'+(cyb-30)+'" width="20" height="6" fill="#7d3b2c"/>';
    if(rf===3) s+='<g class="smoke"><circle cx="'+(chx+8)+'" cy="'+(cyb-38)+'" r="6"/><circle cx="'+(chx+8)+'" cy="'+(cyb-38)+'" r="6"/><circle cx="'+(chx+8)+'" cy="'+(cyb-38)+'" r="6"/></g>';
  }

  var roofC=['#5d4e47',mix('#5d4e47',P.roof,.45),P.roof,P.roof][rf];
  var rp=(x0-12)+','+top+' '+cx+','+(top-rh)+' '+(x0+w+12)+','+top;
  s+='<clipPath id="'+id+'r"><polygon points="'+rp+'"/></clipPath><polygon points="'+rp+'" fill="'+roofC+'"/><g clip-path="url(#'+id+'r)">';
  if(rf===0){
    for(i=0;i<3;i++){var dx=(rR()-.5)*w*.75,b=yb(dx),hy=b+7+rR()*Math.max(2,(top-b)-24),hx=cx+dx;s+='<polygon points="'+hx+','+hy+' '+(hx+13)+','+(hy+2)+' '+(hx+10)+','+(hy+12)+' '+(hx-2)+','+(hy+9)+'" fill="'+sky+'"/>';}
  } else if(rf===1){
    var tdx=(rR()-.5)*w*.3,tb=yb(tdx),tx=cx+tdx;
    s+='<polygon points="'+(tx-18)+','+(top-4)+' '+(tx-8)+','+(tb+10)+' '+(tx+14)+','+(tb+14)+' '+(tx+22)+','+(top-4)+'" fill="#4f86c6"/><line x1="'+(tx-10)+'" y1="'+(top-5)+'" x2="'+(tx-5)+'" y2="'+(tb+12)+'" stroke="#2f5f9a" stroke-width="1.5"/><line x1="'+(tx+8)+'" y1="'+(top-5)+'" x2="'+(tx+10)+'" y2="'+(tb+14)+'" stroke="#2f5f9a" stroke-width="1.5"/>';
  } else {
    for(i=1;i<6;i++){var ly=top-rh*i/6;s+='<line x1="'+(x0-12)+'" y1="'+ly+'" x2="'+(x0+w+12)+'" y2="'+ly+'" stroke="#000000" stroke-opacity=".2" stroke-width="1.5"/>';}
  }
  s+='</g><rect x="'+(x0-12)+'" y="'+top+'" width="'+(w+24)+'" height="4" fill="'+mix(roofC,'#000000',.3)+'"/>';
  if(rf===3) s+='<polyline points="'+rp+'" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2.5" stroke-linejoin="round"/>';

  for(var fl=0;fl<T.floors;fl++){
    var wy=gY-(fl+1)*fh+9;
    for(var k=0;k<T.bays;k++){ if(fl===0&&k===T.door) continue; s+=win(bayX(k),wy,wn,P); }
  }
  s+=door(dX,dr,P,gY);

  var okX=function(){var x;do{x=vx+10+rG()*(vw-20)}while(Math.abs(x-dX)<34);return x};
  var tuft=function(x,y,c,sz){return '<path d="M'+x+' '+y+' l'+(-3*sz)+' '+(-10*sz)+' l'+(3*sz)+' '+(6*sz)+' l'+(2*sz)+' '+(-9*sz)+' l'+sz+' '+(9*sz)+' l'+(3*sz)+' '+(-7*sz)+' l'+(-2*sz)+' '+(11*sz)+'z" fill="'+c+'"/>'};
  var FLC=['#ff6b8b','#ffd23f','#ffffff','#b48cff','#ff9a3c'];
  var flower=function(x,y,c){return '<line x1="'+x+'" y1="'+(y+2)+'" x2="'+x+'" y2="'+(y+7)+'" stroke="#2f7d45" stroke-width="1.5"/><circle cx="'+x+'" cy="'+y+'" r="2.8" fill="'+c+'"/><circle cx="'+x+'" cy="'+y+'" r="1" fill="#fff3b0"/>'};
  if(gd===0) for(i=0;i<12;i++) s+=tuft(okX(),gY+6+rG()*40,'#6b6a3d',1+rG()*.5);
  if(gd===1) for(i=0;i<5;i++) s+=tuft(okX(),gY+8+rG()*38,'#3f9a4e',.8);
  if(gd>=2){
    [x0+12,x0+w-12].forEach(function(bx){s+='<circle cx="'+bx+'" cy="'+(gY-3)+'" r="11" fill="#3f9e55"/><circle cx="'+(bx+9)+'" cy="'+(gY-1)+'" r="9" fill="#4cb064"/><circle cx="'+(bx-8)+'" cy="'+gY+'" r="8" fill="#378f4d"/>'});
    for(i=0;i<(gd===2?8:12);i++) s+=flower(okX(),gY+10+rG()*32,FLC[i%5]);
  }
  if(gd===3) for(var fx=x0+16,n=0;fx<x0+w-8;fx+=14,n++){ if(Math.abs(fx-dX)>30) s+=flower(fx,gY+3,FLC[n%5]); }

  var stone=function(w2,y2){return '<rect x="'+(dX-w2/2)+'" y="'+y2+'" width="'+w2+'" height="7" rx="3" fill="#d3cdbf"/>'};
  if(pc===0) s+='<rect x="'+(dX-20)+'" y="'+gY+'" width="22" height="7" fill="#8c867a"/><rect x="'+(dX+3)+'" y="'+(gY+3)+'" width="17" height="7" fill="#716b60" transform="rotate(5 '+(dX+10)+' '+(gY+6)+')"/><path d="M'+(dX-8)+' '+gY+' l3 4 l-2 3" stroke="#4d4840" fill="none"/>';
  else {
    s+='<rect x="'+(dX-22)+'" y="'+gY+'" width="44" height="8" rx="2" fill="#b7b1a4"/><rect x="'+(dX-22)+'" y="'+gY+'" width="44" height="2" fill="#ffffff" opacity=".35"/>';
    if(pc>=2) for(i=0;i<5;i++) s+=stone(26+i*7,gY+11+i*8.5);
    if(pc===3){
      s+='<rect x="'+(dX-13)+'" y="'+(gY+1)+'" width="26" height="5" fill="#b8412f"/>';
      [dX-36,dX+36].forEach(function(lx){s+='<circle cx="'+lx+'" cy="'+(gY-16)+'" r="11" fill="#ffd86b" opacity=".35"/><rect x="'+(lx-1.5)+'" y="'+(gY-14)+'" width="3" height="16" fill="#3a3a3a"/><circle cx="'+lx+'" cy="'+(gY-16)+'" r="4.5" fill="#ffd86b"/>'});
    }
  }

  if(gd===3){
    s+='<rect x="'+(vx+6)+'" y="233" width="'+(vw-12)+'" height="3" fill="#ffffff"/><rect x="'+(vx+6)+'" y="241" width="'+(vw-12)+'" height="3" fill="#ffffff"/>';
    for(var pxx=vx+10;pxx<vx+vw-8;pxx+=11){ if(Math.abs(pxx-dX)<22) continue; s+='<polygon points="'+pxx+',247 '+pxx+',230 '+(pxx+3)+',226 '+(pxx+6)+',230 '+(pxx+6)+',247" fill="#ffffff" stroke="rgba(0,0,0,.15)"/>'; }
    [vx+24,vx+vw-24].forEach(function(tx){s+='<ellipse cx="'+tx+'" cy="226" rx="18" ry="4" fill="#000000" opacity=".16"/><rect x="'+(tx-4)+'" y="186" width="8" height="40" fill="#7a4b2a"/><circle cx="'+tx+'" cy="170" r="24" fill="#3f9e55"/><circle cx="'+(tx-12)+'" cy="181" r="16" fill="#4cb064"/><circle cx="'+(tx+13)+'" cy="182" r="15" fill="#378f4d"/><circle cx="'+(tx-6)+'" cy="166" r="2.6" fill="#e4472f"/><circle cx="'+(tx+9)+'" cy="176" r="2.6" fill="#e4472f"/>'});
  } else if(gd===0){
    s+='<path transform="translate('+vx+' 0)" d="M24 238 C22 218 27 204 21 180 M23 205 L9 192 M25 196 L38 184 M22 186 L14 174" stroke="#4a3a30" stroke-width="5" stroke-linecap="round" fill="none"/>';
  }
  if(av) s+='<g transform="translate('+(vx+vw*.3)+' 243) scale(.72)">'+avatarG(av)+'</g>';
  return s+'</svg>';
}

/* ---------- state ---------- */
var S=null, playing=null, stopGame=null, modalOpen=false, draft=null, creatorFirst=false;
var GAMES=['nail','pest','tile','stack','pots'];
function fresh(){return {coins:50,sold:0,profit:0,best:0,seq:1,house:null,listings:null,bests:{nail:0,pest:0,tile:0,stack:0,pots:0},glv:{nail:1,pest:1,tile:1,stack:1,pots:1},sel:{nail:1,pest:1,tile:1,stack:1,pots:1},avatar:null,tab:'market',view:'out',room:'kitchen'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function newListing(tier){
  var t=TIERS[tier],areas=areaList(tier),cheap=pick(areas),dear;do{dear=pick(areas)}while(dear===cheap);
  return {id:S.seq++,tier:tier,nominal:t.price,price:Math.max(2,Math.round(t.price*(.88+Math.random()*.24))),cheap:cheap,dear:dear,seed:1+ri(900000),pal:ri(PAL.length)};
}
function makeListings(){var L=[];TIERS.forEach(function(t,i){if(t.unlock<=S.sold){L.push(newListing(i));L.push(newListing(i))}});return L}
function adj2(){return ''}

/* ---------- header ---------- */
var shown=50,coinRaf=0;
function setCoins(n){
  var el=$('#coins');cancelAnimationFrame(coinRaf);
  if(reduce){shown=n;el.textContent=fmt(n);return}
  var from=shown,t0=performance.now();
  (function step(t){var k=Math.min(1,(t-t0)/450);shown=Math.round(from+(n-from)*k);el.textContent=fmt(shown);if(k<1)coinRaf=requestAnimationFrame(step)})(t0);
}
function floatCoin(txt){var d=document.createElement('span');d.className='float';d.textContent=txt;$('#purse').appendChild(d);setTimeout(function(){d.remove()},1300)}
function renderHeader(){
  setCoins(S.coins);
  var p=Math.max(0,S.profit),r=rankOf(p),nx=RANKS[r+1];
  $('#rank').textContent=RANKS[r][1];
  $('#rankbar').style.width=(nx?Math.round((p-RANKS[r][0])/(nx[0]-RANKS[r][0])*100):100)+'%';
  $('#rankinfo').textContent=S.sold+(S.sold===1?' flip':' flips')+' · '+(S.profit>=0?'+':'')+fmt(S.profit);
  $('#avbtn').innerHTML=S.avatar?avatarBust(S.avatar):'';
}

/* ---------- house tab ---------- */
function itemRow(h,it,first){
  var l=getL(h,it),tag=h.cheap===it.area&&it.kind==='ext'?'<span class="chip good">Cheap</span>':h.dear===it.area&&it.kind==='ext'?'<span class="chip bad">Pricey</span>':'';
  var html='<div class="part'+(first?' first':'')+'"><div><div class="pname">'+it.name+' '+tag+'</div><div class="pstate">'+it.states[l]+'</div><div class="pips"><i class="'+(l>0?'on':'')+'"></i><i class="'+(l>1?'on':'')+'"></i><i class="'+(l>2?'on':'')+'"></i></div></div>';
  if(l>=3) return html+'<div class="maxed">Done</div></div>';
  var c=partCost(h,it,l),g=partGain(h,it,l),can=S.coins>=c;
  var key=it.kind==='ext'?'e:'+it.i:'r:'+it.room+':'+it.j;
  return html+'<button class="btn sm upbtn" data-act="up" data-k="'+key+'" aria-disabled="'+(!can)+'">'+it.acts[l]+'<small>'+c+(c===1?' coin':' coins')+' · +'+Math.max(1,Math.round(g))+' value</small></button></div>';
}
function findItem(h,key){
  var p=key.split(':'),its=items(h);
  for(var i=0;i<its.length;i++){var it=its[i];
    if(p[0]==='e'&&it.kind==='ext'&&it.i===+p[1])return it;
    if(p[0]==='r'&&it.kind==='rm'&&it.room===p[1]&&it.j===+p[2])return it;
  }
  return null;
}
function renderHouse(){
  var el=$('#tab-house'),h=S.house;
  if(!h){
    el.innerHTML='<div class="card"><h2>No house yet</h2><p class="sub">Buy a run-down place at the market, do up the outside and every room, then sell it for more than it cost you.</p><div class="row2" style="margin-top:12px"><button class="btn" data-act="go" data-tab="market">Browse the market</button></div></div>';
    return;
  }
  var T=TIERS[h.tier],wv=worth(h),inv=h.paid+h.spent,pr=wv-inv,inside=S.view==='in',n=roomCount(h.tier);
  if(!h.rooms[S.room])S.room='kitchen';
  var html='<div class="card"><div class="seg"><button class="'+(inside?'':'on')+'" data-act="view" data-v="out">Outside</button><button class="'+(inside?'on':'')+'" data-act="view" data-v="in">Inside ('+n+' rooms)</button></div>';
  if(inside){
    html+='<div class="rooms">';
    for(var r=0;r<n;r++){var rm=ROOMSEQ[r];html+='<button class="rchip'+(rm.k===S.room?' on':'')+'" data-act="room" data-k="'+rm.k+'">'+rm.n+'<i>'+roomProg(h,rm.k)+'/12</i></button>'}
    html+='</div><div class="scene" id="scene">'+drawRoom(h,S.room,S.avatar)+'</div>';
  } else html+='<div class="scene" id="scene">'+drawHouse(h,S.avatar)+'</div>';
  html+='<div class="titlerow"><h2>'+adj(h)+' '+T.name+'</h2><span class="chip good">Sound '+areaName(h.cheap).toLowerCase()+'</span><span class="chip bad">Wrecked '+areaName(h.dear).toLowerCase()+'</span></div>';
  html+='<div class="stats"><div class="stat"><span>You put in</span><b>'+fmt(inv)+'</b></div><div class="stat"><span>Worth now</span><b>'+fmt(wv)+'</b></div><div class="stat"><span>If sold</span><b class="'+(pr>=0?'pos':'neg')+'">'+(pr>=0?'+':'')+fmt(pr)+'</b></div></div>';
  html+='<div class="trend">Buyers are mad for the '+areaName(h.trend).toLowerCase()+' right now. Do it up fully for a bigger offer.</div></div>';
  var its=items(h);
  if(inside){
    var rm2=null;ROOMSEQ.forEach(function(x){if(x.k===S.room)rm2=x});
    var R=h.rooms[S.room],sw='';
    SW.forEach(function(c,i){sw+='<button class="sw" style="background:'+c+'" data-act="rcol" data-i="'+i+'" aria-label="'+SWN[i]+'" aria-pressed="'+(R.c===i)+'"></button>'});
    var rtag=h.cheap===S.room?' <span class="chip good">Cheap</span>':h.dear===S.room?' <span class="chip bad">Pricey</span>':'';
    html+='<div class="card"><h2>'+rm2.n+rtag+'</h2><p class="sub">Pick a colour scheme for free, then fix everything up.</p><div class="swatches"><span>Colour</span>'+sw+'</div><div style="margin-top:6px">';
    var first=true;its.forEach(function(it){if(it.kind==='rm'&&it.room===S.room){html+=itemRow(h,it,first);first=false}});
    html+='</div></div>';
  } else {
    html+='<div class="card"><h2>Outside</h2><p class="sub">Each repair costs coins and adds value. The last level of each costs the most.</p><div style="margin-top:6px">';
    var f2=true;its.forEach(function(it){if(it.kind==='ext'){html+=itemRow(h,it,f2);f2=false}});
    html+='</div></div>';
  }
  html+='<div class="sellbar"><button class="btn wide" data-act="sell">Find a buyer</button><button class="tiny" data-act="go" data-tab="games">Short on coins? Take a job</button></div>';
  el.innerHTML=html;
}

/* ---------- market tab ---------- */
function renderMarket(){
  var el=$('#tab-market'),html='';
  if(S.sold===0&&!S.house) html+='<p class="lead">You have 50 coins. Pick a wreck, do up the outside and every room, then sell it on for a profit. Then do it again with a bigger house.</p>';
  if(S.house) html+='<div class="note">You still own your '+TIERS[S.house.tier].name.toLowerCase()+'. Sell it before you buy another.</div>';
  html+='<h2 class="wh">On the market</h2>';
  S.listings.forEach(function(L){
    var t=TIERS[L.tier],can=S.coins>=L.price&&!S.house,need=L.price-S.coins;
    var deal=L.price<=L.nominal*.95?'<span class="chip good">Bargain</span>':L.price>=L.nominal*1.05?'<span class="chip bad">Pricey</span>':'';
    html+='<article class="card listing"><div class="thumb">'+drawHouse({tier:L.tier,pal:L.pal,seed:L.seed,up:[0,0,0,0,0,0]})+'</div><div class="ldet"><h3>Abandoned '+t.name+'</h3><div class="tags"><span class="chip">'+roomCount(L.tier)+' rooms</span><span class="chip good">Sound '+areaName(L.cheap).toLowerCase()+'</span><span class="chip bad">Wrecked '+areaName(L.dear).toLowerCase()+'</span>'+deal+'</div><div class="lrow"><span class="price">'+coin(20)+fmt(L.price)+'</span><button class="btn sm" data-act="buy" data-id="'+L.id+'" aria-disabled="'+(!can)+'">'+(S.house?'Owned':can?'Buy':'Need '+fmt(need)+' more')+'</button></div></div></article>';
  });
  var nt=null;TIERS.forEach(function(t){if(!nt&&t.unlock>S.sold)nt=t});
  if(nt) html+='<div class="locked">Next up: '+nt.name+'. Sell '+(nt.unlock-S.sold)+' more '+(nt.unlock-S.sold===1?'house':'houses')+' to see them listed.</div>';
  html+='<div class="row2" style="justify-content:center"><button class="btn sm blue" data-act="refresh" aria-disabled="'+(S.coins<3)+'">Check new listings · 3 coins</button></div>';
  html+='<button class="tiny" id="resetbtn" data-act="reset">Start over</button>';
  el.innerHTML=html;
}

/* Game 1: Nail It */
function playNail(root,lv){
  var ROUNDS=6,round=0,total=0,res=[],depth=0,busy=false,done=false,frozen=false,t0=0,center=.5,hw=.12,speed=1,raf=0,lastP=0;
  root.innerHTML=head('Nail It · L'+lv,'Round <b id="gr">1</b> of '+ROUNDS+' · <b id="gs">0</b>')+
    '<div class="plank"><svg viewBox="0 0 300 96" preserveAspectRatio="none"><rect x="0" y="40" width="300" height="2" fill="rgba(0,0,0,.12)"/><rect x="0" y="70" width="300" height="2" fill="rgba(0,0,0,.12)"/><rect id="nailshaft" x="144" y="10" width="12" height="60" fill="#8f98a3"/><rect id="nailhead" x="132" y="2" width="36" height="9" rx="3" fill="#b7c0cb"/></svg></div>'+
    '<div class="track" aria-hidden="true"><div class="zone" id="zone"><i></i></div><div class="marker" id="marker"></div></div>'+
    '<div class="verdict" id="verdict" aria-live="polite"></div>'+
    '<button class="btn wide" id="hit">Hammer!</button><div class="pipsrow" id="pips"></div>';
  var marker=$('#marker'),zone=$('#zone'),verdict=$('#verdict');
  function pos(now){var t=((now-t0)/1000*speed)%2;return t<1?t:2-t}
  function setup(){
    speed=.7+.09*lv+round*.2;hw=Math.max(.04,.135-.011*(lv-1)-round*.01);center=.2+Math.random()*.6;
    zone.style.left=((center-hw)*100)+'%';zone.style.width=(hw*200)+'%';
    t0=performance.now();busy=false;frozen=false;verdict.textContent='';
    $('#gr').textContent=round+1;
  }
  function frame(now){if(!frozen){lastP=pos(now);marker.style.left=(lastP*100)+'%'}raf=requestAnimationFrame(frame)}
  $('#hit').onclick=function(){
    if(busy||done)return;busy=true;frozen=true;
    var d=Math.abs(lastP-center),r=d<=hw*.4?'perfect':d<=hw?'good':'miss',pay={perfect:3,good:2,miss:0}[r];
    total+=pay;res.push(r);depth+={perfect:15,good:11,miss:3}[r];

var RAT='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="9" cy="12" r="7" fill="#e9a3b0"/><circle cx="31" cy="12" r="7" fill="#e9a3b0"/><ellipse cx="20" cy="24" rx="16" ry="15" fill="#8d97a6"/><circle cx="14" cy="21" r="2.4" fill="#111"/><circle cx="26" cy="21" r="2.4" fill="#111"/><ellipse cx="20" cy="29" rx="4" ry="3" fill="#e9a3b0"/><path d="M4 27 L12 28 M4 32 L12 30 M36 27 L28 28 M36 32 L28 30" stroke="#dfe4ea" stroke-width="1.4"/></svg>';
var CAT='<svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="5,18 7,3 17,11" fill="#f08a2c"/><polygon points="35,18 33,3 23,11" fill="#f08a2c"/><ellipse cx="20" cy="25" rx="16" ry="14" fill="#f5a04a"/><ellipse cx="14" cy="22" rx="2.2" ry="3" fill="#111"/><ellipse cx="26" cy="22" rx="2.2" ry="3" fill="#111"/><polygon points="17,28 23,28 20,32" fill="#e9707f"/><path d="M5 27 L13 28 M5 32 L13 30 M35 27 L27 28 M35 32 L27 30" stroke="#fff" stroke-width="1.4"/></svg>';
function playPest(root,lv){
  var DUR=20000,hits=0,cats=0,start=performance.now(),over=false,active={},timers=[],spawnT=0,tick=0,maxUp=2+Math.floor(lv/3);
  var cells='';for(var i=0;i<9;i++)cells+='<button class="hole" data-i="'+i+'" aria-label="Hole '+(i+1)+'"><span class="crit"></span></button>';

  var holes=root.querySelectorAll('.hole');

  function show(i,cat){

  if(n===3) g='<polygon points="20,5 35,20 20,35 5,20" fill="#14233a"/><polygon points="20,12 28,20 20,28 12,20" fill="#ffc531"/>';
  if(n===4) g='<rect x="16" y="5" width="8" height="30" fill="#fff"/><rect x="5" y="16" width="30" height="8" fill="#fff"/>';
  if(n===5) for(a=0;a<4;a++)g+='<path d="M0 '+(7+a*10)+' Q5 '+(1+a*10)+' 10 '+(7+a*10)+' T20 '+(7+a*10)+' T30 '+(7+a*10)+' T40 '+(7+a*10)+'" fill="none" stroke="#e5d4f5" stroke-width="3"/>';
  if(n===6) g='<circle cx="20" cy="20" r="15" fill="none" stroke="#ffc531" stroke-width="3"/><circle cx="20" cy="20" r="8" fill="none" stroke="#ffc531" stroke-width="3"/><circle cx="20" cy="20" r="2.5" fill="#ffc531"/>';
  if(n===7) g='<polygon points="0,40 20,4 40,40" fill="#fff"/><polygon points="12,40 20,24 28,40" fill="#e8789a"/>';
  if(n===8) g='<polyline points="0,12 10,4 20,12 30,4 40,12" fill="none" stroke="#fff" stroke-width="3"/><polyline points="0,28 10,20 20,28 30,20 40,28" fill="none" stroke="#fff" stroke-width="3"/><polyline points="0,44 10,36 20,44 30,36 40,44" fill="none" stroke="#fff" stroke-width="3"/>';
  if(n===9) g='<path d="M0 0 A20 20 0 0 1 20 20 L0 20Z" fill="#fff"/><path d="M40 40 A20 20 0 0 1 20 20 L40 20Z" fill="#fff"/><path d="M40 0 A20 20 0 0 0 20 20 L20 0Z" fill="#14233a" opacity=".4"/>';
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="'+b+'"/>'+g+'</svg>';
}
function playTile(root,lv){
  var pairs=lv<=2?6:lv<=4?8:10,back=Math.max(330,700-45*(lv-1)),total=pairs*2,cols=total>16?5:4;
  var order=[],j,t,p;for(p=0;p<pairs;p++){order.push(p);order.push(p)}
  for(j=order.length-1;j>0;j--){var q=ri(j+1);t=order[j];order[j]=order[q];order[q]=t}
  var open=[],matched=0,moves=0,lock=false,done=false,timers=[];
  var cells='';order.forEach(function(v,i){cells+='<button class="tile" data-i="'+i+'" aria-label="Tile '+(i+1)+', face down"></button>'});
  root.innerHTML=head('Tile Match · L'+lv,'Tries <b id="tm">0</b>')+'<div class="tiles" id="tiles" style="grid-template-columns:repeat('+cols+',1fr)">'+cells+'</div><p class="sub" style="margin-top:12px;text-align:center">'+pairs+' pairs. Fewer tries pay more.</p>';
  var tiles=root.querySelectorAll('.tile');
  $('#tiles').onclick=function(e){
    var b=e.target.closest('.tile');if(!b||lock||done)return;var i=+b.dataset.i;
    if(open.indexOf(i)>-1||b.classList.contains('done'))return;
    b.innerHTML=tileSVG(order[i]);b.classList.add('open');open.push(i);
    if(open.length===2){
      moves++;$('#tm').textContent=moves;lock=true;
      var a=open[0],c=open[1];
      if(order[a]===order[c]){
        tiles[a].classList.add('done');tiles[c].classList.add('done');open=[];lock=false;matched++;
        if(matched===pairs){timers.push(setTimeout(function(){if(done)return;done=true;finishGame('tile',Math.max(3,Math.round(pairs*3.3)-moves),lv)},500))}
      } else {
        timers.push(setTimeout(function(){[a,c].forEach(function(x){tiles[x].innerHTML='';tiles[x].classList.remove('open')});open=[];lock=false},back));
      }
    }
  };
  stopGame=function(){done=true;timers.forEach(clearTimeout)};
}

/* Game 4: Brick Stack */
function playStack(root,lv){
  var ROWS=14,BH=24,cols=['#d8573c','#ffc531','#3d8fe0','#2e9e63','#8a5fb5'],rows=1,coins=0,pl=30,pw=40,w=40,t0=performance.now(),done=false,busy=false,raf=0,curL=0;
  root.innerHTML=head('Brick Stack · L'+lv,'Bricks <b id="bk">0</b> · <b id="bc">0</b>')+'<div class="tower" id="tower"><div class="tin" id="tin"></div></div><button class="btn wide" id="drop">Drop!</button>';
  var tin=$('#tin');
  function brick(l,wd,row,col){var d=document.createElement('div');d.className='brk';d.style.left=l+'%';d.style.width=wd+'%';d.style.bottom=(row*BH)+'px';d.style.background=col;tin.appendChild(d);return d}
  brick(pl,pw,0,'#6b7a90');
  var mov=brick(0,w,rows,cols[rows%5]);
  function speed(){return .5+.07*lv+rows*.03}
  function frame(now){
    var t=((now-t0)/1000*speed())%2,p=t<1?t:2-t;curL=p*(100-w);mov.style.left=curL+'%';
    raf=requestAnimationFrame(frame);
  }
  function camera(){tin.style.transform='translateY('+(Math.max(0,rows-9)*BH)+'px)'}
  $('#drop').onclick=function(){
    if(done||busy)return;busy=true;
    var ov=Math.min(curL+w,pl+pw)-Math.max(curL,pl);
    if(ov<=1){
      mov.style.transition='transform .5s ease-in,opacity .5s';mov.style.transform='translateY(200px) rotate(25deg)';mov.style.opacity='0';
      cancelAnimationFrame(raf);done=true;setTimeout(function(){finishGame('stack',coins,lv)},650);return;
    }
    var perfect=Math.abs(curL-pl)<2.2,nl=perfect?pl:Math.max(curL,pl),nw=perfect?pw:ov;
    coins+=perfect?2:1;
    mov.style.left=nl+'%';mov.style.width=nw+'%';
    pl=nl;pw=nw;w=nw;rows++;
    $('#bk').textContent=rows-1;$('#bc').textContent=coins;
    if(rows-1>=ROWS||w<3){cancelAnimationFrame(raf);done=true;setTimeout(function(){finishGame('stack',coins,lv)},500);return}
    camera();
    t0=performance.now();
    mov=brick(0,w,rows,cols[rows%5]);busy=false;
  };
  stopGame=function(){done=true;cancelAnimationFrame(raf)};
  raf=requestAnimationFrame(frame);
}

/* Game 5: Paint Pots */
function playPots(root,lv){
  var n=lv>=5?6:4,cols=['#d8573c','#3d8fe0','#2e9e63','#ffc531','#8a5fb5','#ff8a3c'],names=['Red','Blue','Green','Yellow','Purple','Orange'];
  var flash=Math.max(260,680-50*lv),gap=Math.max(120,260-15*lv),seq=[],step=0,score=0,input=false,done=false,timers=[],i;
  var L0=2+(lv>=3?1:0)+(lv>=6?1:0);
  for(i=0;i<L0;i++)seq.push(ri(n));
  var cells='';for(i=0;i<n;i++)cells+='<button class="pot" data-i="'+i+'" style="background:'+cols[i]+'" aria-label="'+names[i]+' paint pot"></button>';
  root.innerHTML=head('Paint Pots · L'+lv,'Done <b id="ps">0</b>')+'<p class="sub center" id="pmsg">Watch the pots.</p><div class="pots" id="pots" style="grid-template-columns:repeat(2,1fr)">'+cells+'</div>';
  var pots=root.querySelectorAll('.pot');
  function lit(k,ms){pots[k].classList.add('lit');timers.push(setTimeout(function(){pots[k].classList.remove('lit')},ms))}
  function playSeq(){
    input=false;step=0;$('#pmsg').textContent='Watch the pots.';
    seq.forEach(function(k,idx){timers.push(setTimeout(function(){if(!done)lit(k,flash)},500+idx*(flash+gap)))});
    timers.push(setTimeout(function(){if(done)return;input=true;$('#pmsg').textContent='Your turn. '+seq.length+' to copy.'},500+seq.length*(flash+gap)));
  }
  $('#pots').onclick=function(e){
    var b=e.target.closest('.pot');if(!b||!input||done)return;var k=+b.dataset.i;
    lit(k,160);
    if(k!==seq[step]){input=false;done=true;$('#pmsg').textContent='Wrong pot.';timers.push(setTimeout(function(){finishGame('pots',Math.round(score*1.5),lv)},700));return}
    step++;
    if(step===seq.length){
      score++;$('#ps').textContent=score;input=false;
      if(score>=12){done=true;timers.push(setTimeout(function(){finishGame('pots',Math.round(score*1.5),lv)},500));return}
      seq.push(ri(n));timers.push(setTimeout(playSeq,700));
    }
  };
  stopGame=function(){done=true;timers.forEach(clearTimeout)};
  playSeq();
}

function makeOffers(h){

  while(prefs.length<3){var p=pick(pool);if(prefs.indexOf(p)<0)prefs.push(p)}
  var names=BUYERS.slice().sort(function(){return Math.random()-.5});
  return prefs.map(function(p,i){
    var l=areaLevel(h,p),a=l===3?1.14:l===2?1.06:l===0?.94:1;
    return {name:names[i],pref:p,lvl:l,offer:Math.max(1,Math.round(v*(.9+Math.random()*.12)*a))};
  }).sort(function(a,b){return b.offer-a.offer});

  h.offers.forEach(function(o,i){
    var pl=o.offer-inv;
    html+='<div class="offer"><div class="who">'+o.name+'</div><div class="amt">'+fmt(o.offer)+'</div><div class="why">Cares about the '+areaName(o.pref).toLowerCase()+' (level '+o.lvl+' of 3)</div><div class="pl '+(pl>=0?'pos':'neg')+'">'+(pl>=0?'+':'')+fmt(pl)+' profit</div><button class="btn" data-act="agree" data-i="'+i+'">Sell for '+fmt(o.offer)+'</button></div>';
  });
  html+='<div class="row2" style="justify-content:center">'+(h.rerolled?'':'<button class="btn ghost sm" data-act="reroll">Ask around for new offers</button>')+'<button class="btn ghost sm" data-act="closeModal">Not yet</button></div>';
  openModal(html);
}
var stampDone=false;
function agreementSheet(i){
  var h=S.house,o=h.offers[i];if(!o)return;
  var nm=(S.avatar&&S.avatar.name)||'The Builder',T=TIERS[h.tier];
  stampDone=false;
  var html='<div class="bubble">"Lovely, I will take it!"<small>'+esc(o.name)+'</small></div>'+
    '<div class="paper" id="paper"><h3>HOUSE SALE AGREEMENT</h3><dl>'+
    '<div><dt>Property</dt><dd>'+adj(h)+' '+T.name+'</dd></div>'+
    '<div><dt>Seller</dt><dd>'+esc(nm)+'</dd></div>'+
    '<div><dt>Buyer</dt><dd>'+esc(o.name)+'</dd></div>'+
    '<div><dt>Price</dt><dd>'+fmt(o.offer)+' coins</dd></div></dl>'+
    '<div class="sigrow"><span>Signed</span><span class="sig">'+esc(nm)+'</span></div></div>'+
    '<div class="stampzone"><button id="stamp" aria-label="Stamp the agreement"><svg viewBox="0 0 70 90"><rect x="26" y="2" width="18" height="10" rx="5" fill="#8a5a33"/><rect x="29" y="10" width="12" height="38" rx="3" fill="#a9733f"/><rect x="12" y="46" width="46" height="14" rx="4" fill="#d8312b"/><rect x="8" y="58" width="54" height="22" rx="4" fill="#8a1f1a"/><rect x="14" y="64" width="42" height="10" rx="2" fill="#d8312b"/></svg></button></div>'+
    '<p class="stamphint" id="shint">Drag the stamp onto the paper to seal the sale.</p>'+
    '<button class="tiny" data-act="offers">Back to offers</button>';
  openModal(html);
  bindStamp(i);
}
function bindStamp(i){
  var st=$('#stamp'),paper=$('#paper'),sx=0,sy=0,drag=false,moved=0;
  function place(x,y){
    if(stampDone)return;stampDone=true;
    st.style.transform='';st.classList.remove('lift');
    var m=document.createElement('div');m.className='mark';m.textContent='SOLD';m.style.left=x+'px';m.style.top=y+'px';
    paper.appendChild(m);paper.classList.add('bump');
    $('#shint').textContent='Sold!';
    setTimeout(function(){closeModal();accept(i)},1100);
  }
  st.addEventListener('pointerdown',function(e){
    if(stampDone)return;drag=true;moved=0;sx=e.clientX;sy=e.clientY;
    try{st.setPointerCapture(e.pointerId)}catch(x){}
    st.classList.add('lift');e.preventDefault();
  });
  st.addEventListener('pointermove',function(e){
    if(!drag)return;var dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    st.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';
  });
  st.addEventListener('pointerup',function(e){
    if(!drag)return;drag=false;
    var r=paper.getBoundingClientRect(),x=e.clientX,y=e.clientY,inside=x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
    if(moved<8){x=r.left+r.width*.68;y=r.top+r.height*.6;inside=true}
    if(inside)place(x-r.left,y-r.top);else{st.style.transform='';st.classList.remove('lift')}
  });
  st.addEventListener('pointercancel',function(){drag=false;st.style.transform='';st.classList.remove('lift')});
  st.addEventListener('click',function(e){
    if(e.detail===0&&!stampDone){var r=paper.getBoundingClientRect();place(r.width*.68,r.height*.6)}
  });
}
function accept(i){
  var h=S.house,o=h.offers[i];if(!o)return;
  var inv=h.paid+h.spent,profit=o.offer-inv,r0=rankOf(Math.max(0,S.profit));
  S.coins+=o.offer;S.profit+=profit;S.sold++;if(profit>S.best)S.best=profit;
  var T=TIERS[h.tier];
  S.house=null;S.listings=makeListings();
  var r1=rankOf(Math.max(0,S.profit)),unlocked=TIERS.filter(function(t){return t.unlock===S.sold});
  save();renderHeader();floatCoin('+'+fmt(o.offer));
  var html='<h2>Sold to '+esc(o.name)+'</h2><p class="sub">Your '+T.name.toLowerCase()+' went for '+fmt(o.offer)+' coins.</p><div class="big '+(profit>=0?'pos':'neg')+'">'+(profit>=0?'+':'')+fmt(profit)+'</div><p class="sub">'+(profit>=0?'profit on this flip':'loss on this flip. Fix more next time.')+'</p>';
  if(r1>r0)html+='<div class="note">New rank: '+RANKS[r1][1]+'</div>';
  if(unlocked.length)html+='<div class="note">New on the market: '+unlocked.map(function(t){return t.name}).join(', ')+'</div>';
  html+='<button class="btn wide" data-act="next">Find the next house</button>';
  openModal('<div class="sold" style="display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">'+html+'</div>',true);
}

/* ---------- actions ---------- */
function go(tab){
  if(tab!=='games')leaveGame();
  S.tab=tab;
  ['house','games','market'].forEach(function(n){
    $('#tab-'+n).hidden=n!==tab;
    $('#t-'+n).setAttribute('aria-selected',n===tab?'true':'false');
  });
  if(tab==='games'&&!playing)renderGames();
  if(tab==='house')renderHouse();
  if(tab==='market')renderMarket();
  $('#main').scrollTop=0;
  save();
}
var resetT=0;
function act(a,b){
  if(a==='go'){go(b.dataset.tab);return}
  if(a==='avatar'){openCreator(false);return}
  if(a==='ac'){draft[b.dataset.k]=+b.dataset.v;renderCreator();return}
  if(a==='avsave'){
    draft.name=(draft.name||'').trim()||'Builder';S.avatar=draft;save();$('#creator').hidden=true;renderHeader();
    if(creatorFirst){creatorFirst=false;go(S.tab||'market')}else{if(S.tab==='house')renderHouse()}
    return;
  }
  if(a==='view'){S.view=b.dataset.v;renderHouse();save();return}
  if(a==='room'){S.room=b.dataset.k;renderHouse();var rs=$('.rooms');var on=$('.rchip.on');if(on&&rs)rs.scrollLeft=on.offsetLeft-16;save();return}
  if(a==='rcol'){S.house.rooms[S.room].c=+b.dataset.i;save();renderHouse();return}
  if(a==='buy'){
    var L=S.listings.filter(function(x){return x.id==+b.dataset.id})[0];if(!L)return;
    if(S.house){toast('Sell your current house first.');return}
    if(S.coins<L.price){toast('You need '+(L.price-S.coins)+' more coins. Try a job.');return}
    S.coins-=L.price;
    S.house={tier:L.tier,nominal:L.nominal,cheap:L.cheap,dear:L.dear,seed:L.seed,pal:L.pal,paid:L.price,spent:0,up:[0,0,0,0,0,0],rooms:newRooms(L.tier),trend:pick(areaList(L.tier)),offers:null,rerolled:false};
    S.listings=S.listings.filter(function(x){return x.id!==L.id});S.view='out';S.room='kitchen';
    save();renderHeader();go('house');toast('It is yours. Time to fix it up.');return;
  }
  if(a==='up'){
    var h=S.house,it=findItem(h,b.dataset.k);if(!it)return;var l=getL(h,it);if(l>=3)return;var c=partCost(h,it,l);
    if(S.coins<c){toast('Need '+(c-S.coins)+' more coins. Take a job.');return}
    var keepScroll=$('#main').scrollTop;
    S.coins-=c;h.spent+=c;setL(h,it,l+1);h.offers=null;save();renderHeader();renderHouse();
    $('#main').scrollTop=keepScroll;
    var sc=$('#scene');if(sc){sc.classList.remove('pop');void sc.offsetWidth;sc.classList.add('pop');var sv=sc.querySelector('svg');if(sv){sv.classList.add('working');setTimeout(function(){sv.classList.remove('working')},1000)}}
    return;
  }
  if(a==='sell'){sellSheet();return}
  if(a==='agree'){agreementSheet(+b.dataset.i);return}
  if(a==='offers'){sellSheet();return}
  if(a==='reroll'){S.house.rerolled=true;S.house.offers=makeOffers(S.house);sellSheet();return}
  if(a==='closeModal'){closeModal();return}
  if(a==='next'){closeModal();go('market');return}
  if(a==='refresh'){
    if(S.coins<3){toast('Not enough coins.');return}
    S.coins-=3;S.listings=makeListings();save();renderHeader();renderMarket();return;
  }
  if(a==='lvl'){var g=b.dataset.g,d=+b.dataset.d;S.sel[g]=Math.max(1,Math.min(S.glv[g],S.sel[g]+d));save();renderGames();return}
  if(a==='play'){playGame(b.dataset.g);return}
  if(a==='back'){leaveGame();renderGames();return}
  if(a==='reset'){
    if(b.dataset.armed){clearTimeout(resetT);leaveGame();var av=S.avatar;S=fresh();S.avatar=av;S.listings=makeListings();shown=50;save();renderHeader();go('market');toast('Fresh start. 50 coins.');return}
    b.dataset.armed='1';b.textContent='Tap again to erase all progress';resetT=setTimeout(function(){b.dataset.armed='';b.textContent='Start over'},3000);
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.closest('#modal')===null&&b.closest('#creator')===null&&modalOpen)return;
  act(b.dataset.act,b);
});
$('#modal').addEventListener('click',function(e){if(e.target===this&&!modalLocked())closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modalOpen&&!modalLocked())closeModal()});

/* ---------- boot ---------- */
function migrate(){
  S.glv=Object.assign({nail:1,pest:1,tile:1,stack:1,pots:1},S.glv||{});
  S.sel=Object.assign({nail:1,pest:1,tile:1,stack:1,pots:1},S.sel||{});
  S.bests=Object.assign({nail:0,pest:0,tile:0,stack:0,pots:0},S.bests||{});
  var h=S.house;
  if(h){
    if(typeof h.cheap==='number')h.cheap=PARTS[h.cheap].id;
    if(typeof h.dear==='number')h.dear=PARTS[h.dear].id;
    if(!h.rooms)h.rooms=newRooms(h.tier);
    if(!h.trend||typeof h.trend==='number')h.trend=pick(areaList(h.tier));
  }
  if(!S.listings||!S.listings.length||typeof S.listings[0].cheap==='number')S.listings=makeListings();
  if(!S.view)S.view='out';
  if(!S.room)S.room='kitchen';
}
function start(data){
  var st=data&&typeof data.coins==='number'?data:null;
  if(!st){try{var raw=localStorage.getItem(KEY);if(raw)st=JSON.parse(raw)}catch(e){}}
  S=Object.assign(fresh(),st||{});
  migrate();
  shown=S.coins;
  $('#coinicon').innerHTML=coin(28);
  renderHeader();
  go(S.tab||'market');
  if(!S.avatar)openCreator(true);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(function(){return JSON.parse(JSON.stringify(S))})}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
