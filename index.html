<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Time!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{
  --bg1:#fff4d6; --bg2:#ffe0f0; --ink:#3b2a63; --card:#ffffff; --shadow:#e3cf9a;
  --play:#2dbd6e; --playink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#241b3d; --bg2:#3a1f4f; --ink:#fff1c9; --card:#3a2d5c; --shadow:#150e29; --play:#3fd484; --playink:#10301d;}
}
:root[data-theme="dark"]{--bg1:#241b3d; --bg2:#3a1f4f; --ink:#fff1c9; --card:#3a2d5c; --shadow:#150e29; --play:#3fd484; --playink:#10301d;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  color:var(--ink);
  font-family:"Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  text-align:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
.wrap{max-width:900px;margin:0 auto}

h1{font-size:clamp(40px,10vw,72px);margin:8px 0 4px;line-height:1.05}
h1 span{display:inline-block;animation:wiggle 2.4s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.15s}
h1 span:nth-child(3){animation-delay:.3s}
.hello{font-size:clamp(20px,4.5vw,28px);margin:0 0 26px;opacity:.9}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}

.game{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--card);color:inherit;text-decoration:none;
  border-radius:32px;padding:26px 20px 22px;
  box-shadow:0 8px 0 var(--shadow);
  border:5px solid var(--c);
  transition:transform .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.game:hover{transform:translateY(-6px) rotate(-1deg)}
.game:active{transform:translateY(2px);box-shadow:0 3px 0 var(--shadow)}
.game:focus-visible{outline:6px solid var(--ink);outline-offset:4px}

.pic{
  width:128px;height:128px;border-radius:50%;
  background:var(--c);display:grid;place-items:center;
  font-size:72px;line-height:1;margin-bottom:6px;
}
.game h2{margin:0;font-size:clamp(28px,6vw,34px)}
.game p{margin:0;font-size:clamp(18px,4vw,20px);min-height:2.6em}
.tag{
  display:inline-block;background:var(--c);color:#fff;font-weight:700;
  border-radius:999px;padding:4px 14px;font-size:17px;margin-top:4px;
  text-shadow:0 1px 0 rgba(0,0,0,.25);
}
.go{
  margin-top:14px;font-size:30px;font-weight:700;
  background:var(--play);color:var(--playink);
  border-radius:999px;padding:12px 44px;
  box-shadow:0 5px 0 rgba(0,0,0,.2);
}

.spider{--c:#e0457b}
.spot{--c:#3f7be8}

.soon{margin-top:30px;font-size:20px;opacity:.75}

@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}.game{transition:none}.game:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1><span>🎮</span> Game <span>Time</span><span>!</span></h1>
  <p class="hello">Pick a game and press Play!</p>

  <!-- To add a game: copy one of the <a class="game"> cards below, change the link, emoji, name and words,
       and give it a new colour (add a class like .newgame{--c:#2dbd6e} in the style section). -->
  <div class="games">

    <a class="game spot" href="spot-the-difference/">
      <div class="pic" aria-hidden="true">🔍</div>
      <h2>Spot the Difference</h2>
      <p>Two pictures look the same, but they’re not! Can you find all 10 differences?</p>
      <span class="tag">1 player</span>
      <span class="go">Play!</span>
    </a>

    <a class="game spider" href="spider-takedown/">
      <div class="pic" aria-hidden="true">🕷️</div>
      <h2>Spider Takedown</h2>
      <p>A spider game you play in 3D. Play on your own or with friends!</p>
      <span class="tag">1–5 players</span>
      <span class="go">Play!</span>
    </a>

  </div>

  <p class="soon">More games coming soon… 🌟</p>
</main>
</body>
</html>
