<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Time!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{
  --bg1:#fff4d6; --bg2:#ffe0f0; --ink:#3b2a63; --card:#ffffff; --shadow:#e3cf9a;
  --play:#2dbd6e; --playink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#241b3d; --bg2:#3a1f4f; --ink:#fff1c9; --card:#3a2d5c; --shadow:#150e29; --play:#3fd484; --playink:#10301d;}
}
:root[data-theme="dark"]{--bg1:#241b3d; --bg2:#3a1f4f; --ink:#fff1c9; --card:#3a2d5c; --shadow:#150e29; --play:#3fd484; --playink:#10301d;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  color:var(--ink);
  font-family:"Fredoka","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  text-align:center;
  padding:max(14px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));
}
.wrap{max-width:1100px;margin:0 auto}

h1{font-size:clamp(30px,7vw,48px);margin:2px 0 2px;line-height:1.1}
h1 span{display:inline-block;animation:wiggle 2.4s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.15s}
.hello{font-size:clamp(16px,3.5vw,20px);margin:0 0 14px;opacity:.9}

/* Small tiles: lots of games fit on one screen (2 per row on a phone, 5+ on a computer) */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.game{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--card);color:inherit;text-decoration:none;
  border-radius:20px;padding:12px 10px 10px;
  box-shadow:0 4px 0 var(--shadow);
  border:3px solid var(--c);
  transition:transform .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.game:hover{transform:translateY(-3px)}
.game:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.game:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.pic{
  width:48px;height:48px;border-radius:50%;
  background:var(--c);display:grid;place-items:center;
  font-size:28px;line-height:1;
}
.game h2{margin:4px 0 0;font-size:19px;line-height:1.15}
.game p{margin:0;font-size:14px;line-height:1.25;opacity:.85}
.go{
  margin-top:auto;padding-top:0;
  font-size:18px;font-weight:700;
  background:var(--play);color:var(--playink);
  border-radius:999px;padding:6px 26px;min-height:36px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);
}
.game p + .go{margin-top:8px}

@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}.game{transition:none}.game:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1><span>🎮</span> Game <span>Time!</span></h1>
  <p class="hello">Pick a game and press Play!</p>

  <!-- To add a game: copy one <a class="game"> card, then change the link (href), the colour (--c), the emoji,
       the name and the tiny description. Cards sit in a grid and wrap to new rows by themselves. -->
  <div class="games">

    <a class="game" style="--c:#3f7be8" href="spot-the-difference/">
      <div class="pic" aria-hidden="true">🔍</div>
      <h2>Spot the Difference</h2>
      <p>Find 10 differences</p>
      <span class="go">Play!</span>
    </a>

    <a class="game" style="--c:#e0457b" href="spider-takedown/">
      <div class="pic" aria-hidden="true">🕷️</div>
      <h2>Spider Takedown</h2>
      <p>3D game, 1–5 players</p>
      <span class="go">Play!</span>
    </a>

  </div>
</main>
</body>
</html>
